[project]
name = "hoist"
version = "0.1.0"
description = "Build locally, push to a registry, migrate and swap containers with near-zero downtime over SSH. No Ruby, no WSL."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
hoist = "hoist.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
